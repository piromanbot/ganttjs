	<style>
		html, body {
			height: 100%;
			padding: 0;
			margin: 0;
			overflow: hidden;
		}
		.controls {
			padding: 10px;
			background: #f5f5f5;
			border-bottom: 1px solid #ddd;
			display: flex;
			gap: 10px;
		}
		.controls button {
			padding: 8px 16px;
			font-size: 14px;
			cursor: pointer;
			border: 1px solid #ccc;
			border-radius: 4px;
			background: #fff;
		}
		.controls button:hover {
			background: #e8e8e8;
		}
		#gantt_here {
			width: 100%;
			height: calc(100% - 52px);
		}
		/* Hide text, tree icons, and borders in the grid for task 101 */
		.hide-grid-row .gantt_tree_content,
		.hide-grid-row .gantt_tree_icon {
			display: none !important;
		}
		.hide-grid-row {
			background-color: transparent !important;
		}
	</style>
</head>

		<button onclick="exportPDF()">Export to PDF</button>

		gantt.config.date_format = "%d-%m-%Y";

		// Set column width for the timeline to keep a 21-year chart compact
		gantt.config.min_column_width = 40;
		gantt.config.scale_height = 50;

		// Multi-year scale configuration for 21-year timeline
		gantt.config.scales = [
			{ unit: "year", step: 5, format: "%Y" }, // Top scale: 5-year buckets (e.g. 2025, 2030)
			{ unit: "year", step: 1, format: "'%y" }  // Bottom scale: Individual years (e.g. '25, '26)

			{ name: "cumulative_mt", label: "Cumulative (Mt)", align: "center", width: 110 },

		];

			return "<b>Stage:</b> " + task.text +
				"<br><b>Deposition start:</b> " + gantt.templates.tooltip_date_format(start) +
				"<br><b>Capacity end:</b> " + gantt.templates.tooltip_date_format(end) +
				"<br><b>Crest elevation:</b> RL " + task.crest_rl +
				"<br><b>Stage capacity:</b> " + task.capacity_mt + " Mt" +
				"<br><b>Cumulative capacity:</b> " + task.cumulative_mt + " Mt";
		};

				name: "gantt.pdf",

			});
		}

			gantt.exportToPNG({
				name: "gantt.png"
			});
